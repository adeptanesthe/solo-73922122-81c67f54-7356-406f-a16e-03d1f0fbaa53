services:
  web:
    build: .
    image: recycling-backtest:latest
    # Host ports 8000 (compose-native) and 5000 (Flask-conventional) both
    # map to the single container port 8000.
    ports:
      - "8000:8000"
      - "5000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
